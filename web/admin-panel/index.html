<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Insights - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="admin-email">Admin Email</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="login-btn">Login</button>
                </div>
            </form>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="admin-dashboard" style="display: none;">
        <div class="dark bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen">
            <div id="app" class="flex h-screen">
                <!-- Left Sidebar Navigation -->
                <nav id="sidebar" class="w-64 bg-gray-800/50 backdrop-blur-sm border-r border-gray-700/50">
                    <div class="p-6">
                        <h2 class="text-xl font-bold text-white mb-8">🔧 SaaS Admin</h2>
                        <ul class="space-y-2" id="nav-menu">
                            <li>
                                <a href="#" data-page="tenants" class="nav-item active flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Tenant Management
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="cost-analysis" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Cost Analysis
                                    <span class="ml-auto bg-gradient-to-r from-purple-500 to-blue-500 text-xs px-2 py-1 rounded-full">AI</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="usage-insights" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                                    </svg>
                                    Usage Insights
                                    <span class="ml-auto bg-gradient-to-r from-purple-500 to-pink-500 text-xs px-2 py-1 rounded-full">AI</span>
                                </a>
                            </li>
                        </ul>
                        <div class="mt-8 pt-8 border-t border-gray-700/50">
                            <button id="logout-btn" class="w-full flex items-center p-3 rounded-lg hover:bg-red-600/20 text-red-400 hover:text-red-300 transition-all">
                                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
                                </svg>
                                Logout
                            </button>
                        </div>
                    </div>
                </nav>
                
                <!-- Main Content Area -->
                <main class="flex-1 overflow-auto">
                    <div id="page-content" class="p-8">
                        <!-- Dynamic content loaded here -->
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-lg p-6 flex items-center space-x-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div>
            <span class="text-white">Loading insights...</span>
        </div>
    </div>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#8B5CF6',secondary:'#06B6D4'}}}}</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Global Analysis Click Handler -->
    <script>
        // Global function to handle analysis button clicks
        function handleAnalysisClick(analysisType, button) {
            console.log('Admin analysis button clicked:', analysisType);
            
            // Visual feedback
            button.style.opacity = '0.7';
            button.disabled = true;
            const originalText = button.textContent;
            button.textContent = 'Loading...';
            
            // Reset button after 3 seconds
            setTimeout(() => {
                button.style.opacity = '1';
                button.disabled = false;
                button.textContent = originalText;
            }, 3000);
            
            // Debug information
            console.log('Available window objects:', Object.keys(window).filter(key => key.includes('Usage')));
            console.log('UsageAnalysisDashboard type:', typeof window.UsageAnalysisDashboard);
            
            // Try to call the dashboard function if available
            if (window.UsageAnalysisDashboard && typeof window.UsageAnalysisDashboard.loadSpecificAnalysis === 'function') {
                console.log('Calling UsageAnalysisDashboard.loadSpecificAnalysis');
                try {
                    window.UsageAnalysisDashboard.loadSpecificAnalysis(analysisType);
                } catch (error) {
                    console.error('Error calling loadSpecificAnalysis:', error);
                    alert('Error loading usage analysis: ' + error.message);
                }
            } else {
                console.log('UsageAnalysisDashboard not available, trying manual trigger');
                console.log('Available methods:', window.UsageAnalysisDashboard ? Object.keys(window.UsageAnalysisDashboard) : 'Dashboard not found');
                
                // Try to initialize first
                if (window.UsageAnalysisDashboard && typeof window.UsageAnalysisDashboard.init === 'function') {
                    console.log('Trying to initialize UsageAnalysisDashboard first');
                    window.UsageAnalysisDashboard.init();
                    setTimeout(() => {
                        if (typeof window.UsageAnalysisDashboard.loadSpecificAnalysis === 'function') {
                            window.UsageAnalysisDashboard.loadSpecificAnalysis(analysisType);
                        } else {
                            alert('Usage Analysis is still initializing. Please try again in a moment.');
                        }
                    }, 2000);
                } else {
                    // Last resort: try to reload the page or show helpful error
                    console.error('UsageAnalysisDashboard completely unavailable');
                    alert('Usage Analysis module failed to load. Please refresh the page and try again.');
                }
            }
        }
        
        // Test function accessible from console
        function testAnalysisClick() {
            console.log('Testing admin analysis click...');
            handleAnalysisClick('feature_adoption', { 
                style: {}, 
                textContent: 'Test Button',
                disabled: false 
            });
        }
    </script>
    <!-- Application Scripts -->
    <script src="config.js"></script>
    <script src="usage-insights-api.js"></script>
    <script src="navigation.js"></script>
    <script src="cost-analysis.js"></script>
    <script src="usage-insights.js"></script>
    <script src="script.js"></script>
</body>
</html>
