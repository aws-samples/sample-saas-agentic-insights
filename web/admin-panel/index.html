<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Insights - Admin Panel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#06B6D4'
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white">
    
    <!-- Login Modal -->
    <div id="login-modal" class="modal fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 w-96">
            <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
            <form id="login-form">
                <div class="form-group mb-4">
                    <label for="admin-email" class="block text-sm font-medium mb-2">Admin Email</label>
                    <input type="email" id="admin-email" required class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none">
                </div>
                <div class="form-group mb-4">
                    <label for="admin-password" class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="admin-password" required class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none">
                </div>
                <div class="form-actions">
                    <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 p-3 rounded-lg transition-all">Login</button>
                </div>
            </form>
            <div id="login-error" class="error-message mt-4 text-red-400" style="display: none;"></div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="flex h-screen" style="display: none;">
        
        <!-- Left Sidebar Navigation -->
        <nav id="sidebar" class="w-64 bg-gray-800/50 backdrop-blur-sm border-r border-gray-700/50">
            <div class="p-6">
                <h2 class="text-xl font-bold text-white mb-8">🔧 SaaS Admin</h2>
                
                <!-- Navigation Menu -->
                <ul class="space-y-2" id="nav-menu">
                    <li>
                        <a href="#" data-page="dashboard" class="nav-item active flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"></path>
                            </svg>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="tenants" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Tenant Management
                        </a>
                    </li>
                    <li>
                        <a href="#" data-page="cost-analysis" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-700/50 transition-all">
                            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Cost Analysis
                            <span class="ml-auto bg-gradient-to-r from-purple-500 to-blue-500 text-xs px-2 py-1 rounded-full">AI</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <!-- Main Content Area -->
        <main class="flex-1 overflow-auto">
            <div id="page-content" class="p-8">
                <!-- Dynamic content loaded here -->
            </div>
        </main>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-lg p-6 flex items-center space-x-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div>
            <span class="text-white">Loading insights...</span>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="navigation.js"></script>
    <script src="cost-analysis.js"></script>
    <script src="script.js"></script>
</body>
</html>
